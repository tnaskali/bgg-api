[tools]
java = "temurin-25"
maven = "3.9.16"

[env]
GRAALVM_VERSION = "graalvm-community-25"

[tasks."check"]
description = "Run all checks (formatting, linting)"
depends = ["check:*"]

[tasks."check:format"]
description = "Check code formatting (Spotless)"
run = "mvn --batch-mode spotless:check"

[tasks."fix"]
description = "Run all fixes (formatting)"
depends = ["fix:*"]

[tasks."fix:format"]
description = "Apply code formatting (Spotless)"
run = "mvn --batch-mode spotless:apply"

[tasks."build"]
description = "Compile and package the application (runs unit tests)"
run = "mvn --batch-mode package"

[tasks."test"]
description = "Run the full test suite (unit + integration tests)"
run = "mvn --batch-mode verify"

[tasks."run"]
description = "Run the application"
run = "mvn spring-boot:run"

[tasks."native:build"]
description = "Build the GraalVM native image"
run = "mvn --batch-mode native:compile -Pnative"
tools = { java = "{{env.GRAALVM_VERSION}}" }
env = { GRAALVM_HOME = "{{env.JAVA_HOME}}" }
sources = ["src/main/**/*", "src/test/**/*", "pom.xml"]
outputs = ["target/bgg-api"]

[tasks."native:test"]
description = "Run the full test suite against a native image"
run = "mvn --batch-mode test -PnativeTest"
tools = { java = "{{env.GRAALVM_VERSION}}" }
env = { GRAALVM_HOME = "{{env.JAVA_HOME}}" }

[tasks."native:run"]
description = "Run the compiled native image"
run = "./target/bgg-api"
depends = ["native:build"]
